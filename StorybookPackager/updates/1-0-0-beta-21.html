<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Storybook Packager 1.0.0-beta (21) Release Notes</title>
    <style>
        body {
            font-size: 14px;
            line-height: 1.25em;
            font-family: sans-serif;
            max-width: 900px;
            margin: 0 auto;
            box-sizing: border-box;
            color: #000000;
            background-color: #ffffff;
        }
        
        section {
            position: relative;
            padding: 32px 16px 8px 32px;
            box-sizing: border-box;
        }
        
        section.new {
            background-color: #f4fff0;
        }
        
        section.new:before {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            content: "🥳 New Features";
            color: #29b935;
            top: 20px;
            left: 10px;
        }
        
        section.enhancement {
            background-color: #daf1ff;
        }
        
        section.enhancement:before {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            content: "✨ Enhancements";
            color: #007cb5;
            top: 20px;
            left: 10px;
        }
        
        section.issue {
            background-color: #fdffe2;
        }
        
        section.issue:before {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            content: "Bugs 🐛";
            color: #b5a600;
            top: 20px;
            left: 10px;
        }
        
        section ul {
            margin: 0;
            padding: 16px 0 0;
        }
        
        section ul li {
            margin: 4px 0;
        }
        
        .none {
            display: none;
        }
    </style>
</head>
<body>
    
    <section class="new none">
        <ul></ul>
    </section>
    
    <section class="enhancement">
        <ul>
            <li>HTML/XML Reservered character entities encoding is now part of the SBPLUS XML Parser instead of the Storybook Packager app.</li>
        </ul>
    </section>
    
    <section class="issue none">
        <ul></ul>
    </section>
    
</body>
</html>
